name: Documentation quality

on:
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - ".agents/skills/README.md"
      - "docs/**"
      - "registers/**"
      - "templates/**"
      - "scripts/validate-docs.mjs"
      - ".github/workflows/documentation-quality.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "registers/**"
      - "templates/**"
      - "scripts/validate-docs.mjs"
      - ".github/workflows/documentation-quality.yml"

permissions:
  contents: read

concurrency:
  group: documentation-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation and registers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate metadata, links, task IDs and traceability
        run: node scripts/validate-docs.mjs
