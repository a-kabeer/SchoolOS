services:
  postgres:
    image: postgres:17-alpine
    container_name: schoolos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schoolos_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-schoolos_local_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-schoolos_dev} -d $${POSTGRES_DB:-schoolos_local_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
